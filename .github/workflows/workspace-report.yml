name: workspace-report

# Aigent Z's administration of the Horizen Workspace (Chrysalis tracker row 102;
# Horizen audit Phase 3b). Publishes the daily report every morning and the
# weekly report on Monday mornings, by POSTing the report route — the same
# composer the Administration surface reads, so the scheduled report and the
# on-screen one can never disagree.
#
# Mirrors the established scheduled-job convention in this repo
# (access-receipts-batcher.yml): GitHub Actions cron → an ops-token-authorised
# endpoint on the dev host.
#
# Required repo secret (Settings → Secrets and variables → Actions):
#   ADMIN_OPS_TOKEN — the same value already set in Amplify env.
#
# Report-receipt attribution (2026-07-30 — operator ruling: Aigent Z composes
# and issues the platform-state report, not MoneyPenny):
#   Primary source of authority: resolveAuthoritativePersonaForRole
#   ('platform-state-reporter') in services/workflows/identityEnvelope.ts,
#   which resolves the WORKFLOW_AUTHORITATIVE_PERSONAS registry (falls back to
#   a built-in default list — see that file — so no env var is required for
#   this to work out of the box).
#   Deprecated compatibility override: the Amplify env var
#   WORKSPACE_REPORT_PERSONA_ID is read ONLY if the role resolver throws. It
#   carries no independent authority of its own. See
#   codexes/packs/agentiq/updates/2026-07-30_platform-state-reporter-role-resolver.md.
#
# Manual trigger: Actions → workspace-report → Run workflow (choose the period).

on:
  schedule:
    # 07:00 UTC daily — the Chief-of-Staff wakeup.
    - cron: '0 7 * * *'
    # 07:30 UTC Monday — the weekly, half an hour after Monday's daily so the
    # two never race for the same concurrency slot.
    - cron: '30 7 * * 1'
  workflow_dispatch:
    inputs:
      period:
        description: 'Report period'
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly

concurrency:
  group: workspace-report
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the workspace report
        env:
          ADMIN_OPS_TOKEN: ${{ secrets.ADMIN_OPS_TOKEN }}
          # A cron run has no inputs, so derive the period from which schedule
          # fired; a manual run uses the chosen input.
          PERIOD: ${{ github.event.inputs.period || (github.event.schedule == '30 7 * * 1' && 'weekly' || 'daily') }}
        run: |
          if [ -z "$ADMIN_OPS_TOKEN" ]; then
            echo "::error::ADMIN_OPS_TOKEN secret not set in repo settings"
            exit 1
          fi
          echo "Publishing the $PERIOD report for horizen-pilot-series-001"
          response=$(curl -fsS --max-time 60 -X POST \
            -H "Authorization: Bearer $ADMIN_OPS_TOKEN" \
            "https://dev-beta.aigentz.me/api/venture/workspace/horizen-pilot-series-001/report?period=$PERIOD")
          echo "Report response: $response"
          ok=$(echo "$response" | python3 -c "import sys,json; print(json.load(sys.stdin).get('ok', False))")
          if [ "$ok" != "True" ] && [ "$ok" != "true" ]; then
            echo "::error::Report publish reported failure"
            exit 1
          fi
          # Surface the headline in the run log so the Actions history itself
          # reads as a trend without opening the app.
          echo "$response" | python3 -c "import sys,json; r=json.load(sys.stdin).get('report') or {}; print('::notice::' + str(r.get('headline','(no headline)')))"
