name: migration-ledger-check

# One-off, manually-triggered ops diagnostic (Horizen Pilot Closure —
# "migration drift first", 2026-08-09). Curls /api/ops/dvn/migration-ledger
# and prints the result — no schedule, no mutation.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query migration ledger
        env:
          CRON_TRIGGER_TOKEN: ${{ secrets.CRON_TRIGGER_TOKEN }}
        run: |
          if [ -z "$CRON_TRIGGER_TOKEN" ]; then
            echo "::error::CRON_TRIGGER_TOKEN secret not set in repo settings"
            exit 1
          fi
          curl -sS --max-time 60 \
            -H "x-cron-token: $CRON_TRIGGER_TOKEN" \
            "https://dev-beta.aigentz.me/api/ops/dvn/migration-ledger"
