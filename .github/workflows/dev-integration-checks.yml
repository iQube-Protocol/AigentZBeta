name: Dev Integration Checks

# dev is this project's actual integration base (see CLAUDE.md's Deployment
# section: the merge-claude-to-dev workflow merges every session branch here,
# and Amplify builds from it). Neither ci.yml (targets main/staging) nor
# lint.yml (targets main/develop) runs on PRs into dev, so PRs into dev have
# had NO CI coverage at all.
#
# This workflow is deliberately narrow: type-check + the vitest suite only
# (the "typecheck/tests/canaries" a dev-integration PR actually needs to
# prove). It does NOT fold in lint.yml's eslint/prettier/npm-audit/bundle-size
# jobs -- those carry substantial pre-existing failures across files unrelated
# to any given dev-integration PR (observed directly: `next lint
# --max-warnings=0` and `npm audit --audit-level=moderate` both fail on `dev`
# today for reasons with nothing to do with whatever a specific PR changed).
# Gating dev PRs on that backlog would block unrelated integration work
# without giving anyone a way to fix it in the PR that hit it. If that backlog
# is cleaned up, folding dev into lint.yml's own branch list is the better
# long-term home for those checks -- this workflow is the narrow gate until
# then.
#
# Type-check itself is non-blocking here (continue-on-error), for the same
# reason: a prior tsconfig.json bug (`ignoreDeprecations` value invalid for
# the installed TS version, plus a `typeRoots` entry pointing at a plain
# source directory with no ambient-package entry point) made `tsc --noEmit`
# fail immediately, on every commit, with zero relation to any PR's diff --
# confirmed identical on a clean `dev` checkout. Fixing that config bug
# surfaced ~40 further pre-existing type errors across files this workflow's
# introducing PR never touched. Hard-blocking on that backlog would repeat
# the same "unrelated pre-existing failure blocks the PR that happened to
# turn the light on" problem one level down, and per anchoring-readiness.yml's
# own precedent in this repo: failing on an expected/known-degraded state
# "would train everyone to ignore this job within a day." Tests remain the
# hard gate; type-check output stays visible so the debt doesn't disappear.

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  typecheck-and-test:
    name: 'Type-check + test suite'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript type checking (informational -- see workflow header)
        run: npm run type-check
        continue-on-error: true

      - name: Run tests
        run: npm run test:ci
