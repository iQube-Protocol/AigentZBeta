name: provision-platform-agent

# One-off, manually-triggered platform-agent identity provisioning
# (Factor/Aegis, capacity remediation 2026-09-05). Calls
# /api/ops/agents/provision-platform-agent under PLATFORM AUTHORITY
# (services/access/personaCapacity.ts's isPlatformAuthority — unbounded
# sponsorship capacity, never a retail-user quota). Idempotent — a repeat
# run returns the already-provisioned agent's identity rather than erroring.
# Never returns a sponsor persona/passport id.
on:
  workflow_dispatch:
    inputs:
      agentSlug:
        description: 'Allowlisted platform agent'
        required: true
        type: choice
        options:
          - factor
          - aegis

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Provision platform-agent identity chain
        env:
          CRON_TRIGGER_TOKEN: ${{ secrets.CRON_TRIGGER_TOKEN }}
        run: |
          if [ -z "$CRON_TRIGGER_TOKEN" ]; then
            echo "::error::CRON_TRIGGER_TOKEN secret not set in repo settings"
            exit 1
          fi
          curl -sS --max-time 60 -X POST \
            -H "x-cron-token: $CRON_TRIGGER_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"agentSlug":"${{ inputs.agentSlug }}"}' \
            "https://dev-beta.aigentz.me/api/ops/agents/provision-platform-agent"
