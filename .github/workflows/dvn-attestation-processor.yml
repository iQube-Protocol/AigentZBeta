name: dvn-attestation-processor

# ── CLOSES THE MISSING SCHEDULER LEG (Horizen Pilot Closure, Part B2, 2026-08-09) ──
#
# dvn-reconciler.yml -> /api/ops/sync/cron-tick is a PoS/Bitcoin-anchor
# reconciler ONLY. It reads dvn.get_pending_messages() solely to compute
# drift for telemetry, and its own "idle" decision is driven purely by
# pos.get_pending_count() === 0 — it never calls dvn.submit_attestation().
# The ONLY code path that does (processPendingDvnAttestations, extracted
# from the former process_pending action in
# app/api/ops/layerzero/process/route.ts into
# services/ops/dvnAttestationProcessor.ts) had ZERO scheduled trigger before
# this workflow: historically only the removed client-side /ops auto-repair
# loop drained it, meaning DVN-pending messages could accumulate
# indefinitely with a healthy, successfully-ticking dvn-reconciler running
# the whole time. This workflow gives that existing, unmodified processor
# independent liveness, driven from DVN pending state — never PoS pending
# count.
#
# ── B3 BOUNDED PASS: CONFIRMED ACCEPTED (operator, 2026-08-09) ──────────────
#
# One manual workflow_dispatch run against the live canister returned
# {"processed":10,"rejected":0,"failed":0,"canisterErrors":[]} — every
# submission in the batch was accepted ("Attestation recorded. Need 1 more
# attestations"). Per the operator's explicit instruction ("if the canister
# accepts the current pilot attestations, then give the existing process
# independent scheduled liveness"), this now runs on a schedule. Nothing
# about validatorId generation, signature generation, batch size, or
# attestation semantics changed to get here — this was a pure liveness
# decision, made only after observing a real, accepted response.
#
# 5-minute cadence, matching activity-receipts-finalizer.yml's — that
# finalizer is exactly what this processor unblocks (it promotes
# dvn_pending -> dvn_recorded once a message's attestation count reaches
# the canister's threshold), and the observed backlog (471 pending
# messages, 10/run, 2 attestations required per message) needs sustained
# ticking rather than the slower 15-minute PoS/anchor cadence.
#
# The current validator/signature substrate is test-grade
# (`validator_<ts>_<id>` / `sig_<id>_<ts>` bytes) — this is the dev/pilot
# validator substrate, not production independent-validator cryptography,
# and must be labelled as such wherever this workflow's results are reported.
#
# Required secret (already provisioned for dvn-reconciler.yml — same token,
# same env var, no new secret to add):
#   CRON_TRIGGER_TOKEN
#
# Manual trigger: Actions -> dvn-attestation-processor -> Run workflow.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  # Never overlap runs against the same pending set.
  group: dvn-attestation-processor
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Run one bounded DVN attestation processing pass
        env:
          CRON_TRIGGER_TOKEN: ${{ secrets.CRON_TRIGGER_TOKEN }}
        run: |
          if [ -z "$CRON_TRIGGER_TOKEN" ]; then
            echo "::error::CRON_TRIGGER_TOKEN secret not set in repo settings"
            exit 1
          fi
          response=$(curl -sS --max-time 60 -X POST \
            -H "x-cron-token: $CRON_TRIGGER_TOKEN" \
            "https://dev-beta.aigentz.me/api/ops/dvn/attestation-processor-cron")
          echo "Processor response: $response"
          ok=$(echo "$response" | python3 -c "import sys,json; print(json.load(sys.stdin).get('ok', False))" 2>/dev/null || echo "parse_error")
          if [ "$ok" = "parse_error" ]; then
            echo "::error::Processor returned an unparseable response (see body above)"
            exit 1
          fi
          if [ "$ok" != "True" ] && [ "$ok" != "true" ]; then
            echo "::error::Processor reported failure"
            exit 1
          fi
