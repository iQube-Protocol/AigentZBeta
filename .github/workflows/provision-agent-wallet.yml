name: provision-agent-wallet

# One-off, manually-triggered purpose-bound wallet provisioning (Horizen
# Pilot Closure, 2026-08-09). Calls /api/ops/wallet/provision-agent-wallet.
# Idempotent — returns the existing binding if one is already provisioned,
# never regenerates. Never returns private key material.
on:
  workflow_dispatch:
    inputs:
      agentRuntimeId:
        description: 'Agent runtime id, e.g. aigent-nakamoto'
        required: true
        default: 'aigent-nakamoto'
      walletRole:
        description: 'Wallet role'
        required: true
        default: 'trading'
        type: choice
        options:
          - trading
          - settlement
          - treasury
      network:
        description: 'Network label'
        required: false
        default: 'base-mainnet'
      chainId:
        description: 'Chain id'
        required: false
        default: '8453'

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Provision purpose-bound agent wallet
        env:
          CRON_TRIGGER_TOKEN: ${{ secrets.CRON_TRIGGER_TOKEN }}
        run: |
          if [ -z "$CRON_TRIGGER_TOKEN" ]; then
            echo "::error::CRON_TRIGGER_TOKEN secret not set in repo settings"
            exit 1
          fi
          curl -sS --max-time 60 -X POST \
            -H "x-cron-token: $CRON_TRIGGER_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"agentRuntimeId":"${{ inputs.agentRuntimeId }}","walletRole":"${{ inputs.walletRole }}","network":"${{ inputs.network }}","chainId":${{ inputs.chainId }}}' \
            "https://dev-beta.aigentz.me/api/ops/wallet/provision-agent-wallet"
