name: correct-premature-standing-seed

# One-off, manually-triggered non-destructive correction (URGENT SEQUENCING
# CORRECTION — AigentQube Presence ≠ Factory Ingestion, 2026-08-09). Calls
# /api/ops/journey/correct-premature-standing-seed, which re-verifies the
# defect signature itself before acting and never deletes or mutates the
# original standing_accrued receipt.
on:
  workflow_dispatch:
    inputs:
      agentRuntimeId:
        description: 'Agent runtime id, e.g. aigent-moneypenny'
        required: true
        default: 'aigent-moneypenny'
      aigentQubeId:
        description: 'AigentQube asset id, e.g. aigentqube-moneypenny'
        required: true
        default: 'aigentqube-moneypenny'
      journeyId:
        description: 'Journey id (defaults to the Horizen admission journey)'
        required: false
        default: 'horizen-moneypenny-admission'
      correctingPersonaId:
        description: 'The active operator persona id performing this correction (required — a real "who" for the audit trail)'
        required: true

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Correct premature Standing seed
        env:
          CRON_TRIGGER_TOKEN: ${{ secrets.CRON_TRIGGER_TOKEN }}
        run: |
          if [ -z "$CRON_TRIGGER_TOKEN" ]; then
            echo "::error::CRON_TRIGGER_TOKEN secret not set in repo settings"
            exit 1
          fi
          curl -sS --max-time 60 -X POST \
            -H "x-cron-token: $CRON_TRIGGER_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"agentRuntimeId":"${{ inputs.agentRuntimeId }}","aigentQubeId":"${{ inputs.aigentQubeId }}","journeyId":"${{ inputs.journeyId }}","correctingPersonaId":"${{ inputs.correctingPersonaId }}"}' \
            "https://dev-beta.aigentz.me/api/ops/journey/correct-premature-standing-seed"
