name: Build MoneyPenny Projector WASM (TinyGo 0.42.0)

# Unblocks WASM builds for operators whose local TinyGo 0.42.0 binary cannot
# run (e.g. macOS 12: Homebrew TinyGo 0.42.0 needs a newer libc++ symbol than
# the OS ships) and who have no Docker available. Builds ONLY
# services/vela/wasm/projector's existing `production_build` Makefile target
# — the exact flags this repo already uses (-opt=s -no-debug -target=wasi) —
# on a Linux runner, and uploads the resulting WASM as a downloadable
# artifact. Never commits the binary (production_build/ is gitignored), never
# runs UC0, never contacts Synsema or Supabase, and needs no repository
# secrets.

on:
  push:
    branches:
      - claude/amplify-build-handoff-doc-prubcy
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    env:
      TINYGO_VERSION: '0.42.0'
      WASM_DIR: services/vela/wasm/projector
      WASM_NAME: moneypenny_projector.wasm
      # Repository's own tracked-file size discipline (CLAUDE.md "Dense
      # Materials" — no tracked file over 1 MB); applied here as this
      # artifact's own size budget even though it is never tracked in git.
      SIZE_BUDGET_BYTES: 1048576
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOT go-version-file: services/vela/wasm/projector/go.mod pins go
      # 1.24.0/toolchain go1.24.7 for the APP itself, but TinyGo 0.42.0
      # requires the go TOOLCHAIN that invokes it to be 1.25 through 1.27
      # (observed live: run 34989988060 failed with "requires go version
      # 1.25 through 1.27, got go1.24"). A newer go toolchain building an
      # older go.mod's `go 1.24.0` directive is forward-compatible, so this
      # does not conflict with the module's own pin.
      - name: Setup Go (satisfies TinyGo 0.42.0's own go1.25-1.27 requirement)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install TinyGo ${{ env.TINYGO_VERSION }} (pinned, Linux amd64 .deb)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/tinygo.deb \
            "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/tinygo.deb
          # The .deb's own install path varies by package build — never
          # hardcoded. Resolve the installed binary from PATH (dpkg registers
          # it via update-alternatives/symlink) instead.
          TINYGO_BIN="$(command -v tinygo)"
          test -n "$TINYGO_BIN"
          "$TINYGO_BIN" version
          echo "TINYGO_BIN=${TINYGO_BIN}" >> "$GITHUB_ENV"

      - name: Build production WASM (make production_build — repo's own -opt=s -no-debug -target=wasi flags)
        working-directory: ${{ env.WASM_DIR }}
        run: make production_build TINYGO="$TINYGO_BIN"

      - name: Compute and record SHA-256
        working-directory: ${{ env.WASM_DIR }}/production_build
        run: |
          set -euo pipefail
          sha256sum "${WASM_NAME}" | tee "${WASM_NAME}.sha256"
          echo "WASM_SHA256=$(cut -d ' ' -f1 "${WASM_NAME}.sha256")" >> "$GITHUB_ENV"

      - name: Enforce artifact size budget
        working-directory: ${{ env.WASM_DIR }}/production_build
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s "${WASM_NAME}")
          echo "${WASM_NAME} is ${SIZE} bytes (budget: ${SIZE_BUDGET_BYTES} bytes)"
          if [ "${SIZE}" -gt "${SIZE_BUDGET_BYTES}" ]; then
            echo "::error::${WASM_NAME} is ${SIZE} bytes, exceeding the ${SIZE_BUDGET_BYTES}-byte budget."
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "### MoneyPenny Projector WASM build"
            echo ""
            echo "- TinyGo: ${TINYGO_VERSION}"
            echo "- Flags: \`-opt=s -no-debug -target=wasi\`"
            echo "- SHA-256: \`${WASM_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: ${WASM_SHA256}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moneypenny-projector-wasm
          path: |
            ${{ env.WASM_DIR }}/production_build/${{ env.WASM_NAME }}
            ${{ env.WASM_DIR }}/production_build/${{ env.WASM_NAME }}.sha256
          retention-days: 14
          if-no-files-found: error
