name: Issue 112 bounded implementation

on:
  push:
    branches:
      - aigentz/issue-112-persona-recross
    paths:
      - .github/workflows/issue-112-persona-recross.yml

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: aigentz/issue-112-persona-recross
          fetch-depth: 0

      - name: Verify Claude execution credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is unavailable to this workflow"
            exit 1
          fi
          echo "ANTHROPIC_API_KEY is available (value not printed)"

      - name: Materialize Issue 112
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue view 112 --repo iQube-Protocol/AigentZBeta --json title,body > /tmp/issue112.json

      - name: Claude Code — implement Issue 112
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          prompt: |
            Implement GitHub Issue #112 on the CURRENT branch only. Read /tmp/issue112.json for the complete title, requirements, invariants, acceptance tests, exclusions, and delivery requirements. Read CLAUDE.md and docs/platform-ontology.md FIRST and obey them exactly. Perform the mandatory resolution/invariant preflight before coding. Extend existing identity, Threshold, OAuth/PKCE, Constitutional Agreement, and iQube access sources of truth; never create parallel authority or inventory logic.

            Preserve all existing Constitutional Agreement, iqube.read, Registry/Persona access, and Party A pinned repository hash-verification checks. Do not touch Party B/AutoDrive/upload transport, replace exchange artifacts, use raw SQL authority overrides, expose T0 identifiers, mutate principal_public_ref in place, union persona visibility, or carry old service agreements/admin scope into a new persona session.

            Add the focused regression tests required by Issue #112 and run those tests plus appropriate type/build checks for every file touched. Report validation exactly; do not claim unrun tests.

            Before the final implementation commit, delete .github/workflows/issue-112-persona-recross.yml so this one-shot dispatcher is absent from the PR diff. Commit focused changes, push the CURRENT branch, and open a PR to dev. NEVER push to dev/main, merge, or enable auto-merge.
          claude_args: |
            --max-turns 40
            --allowedTools "Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(npx:*),Bash(node:*),Bash(npm:*),Read,Write,Edit,Glob,Grep"
        env:
          GH_TOKEN: ${{ github.token }}
