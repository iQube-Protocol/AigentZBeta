version: 1

frontend:
  phases:
    preBuild:
      commands:
        - echo "Installing Node.js 20.18.0..."
        - nvm install 20.18.0
        - nvm use 20.18.0
        - node --version
        - echo "Configuring npm network retries..."
        - npm config set fetch-retries 5
        - npm config set fetch-retry-factor 2
        - npm config set fetch-retry-mintimeout 20000
        - npm config set fetch-retry-maxtimeout 120000
        - npm config set prefer-offline true
        - npm config set audit false
        - npm config set fund false
        - echo "Installing dependencies..."
        - npm install --legacy-peer-deps --include=optional

        # Issue 3 dependency (Ghostscript) — AL2023 uses dnf (yum may be a shim)
        - echo "Installing Ghostscript..."
        - sudo dnf install -y ghostscript || sudo yum install -y ghostscript
        - gs --version
        
        # Install Sharp for Linux x64 platform
        - echo "Installing Sharp for Linux..."
        - npm install --os=linux --cpu=x64 sharp
    build:
      commands:
        # CONSTITUTIONAL GATE — fail the deploy on any NEW persona-spine
        # violation (persona-unaware client fetch). Runs first, before the
        # expensive build. Identity is foundational; a break here compounds
        # through every gate/receipt/grant downstream. See CLAUDE.md →
        # "Client-side spine fetches" and scripts/check-persona-spine.mjs.
        - echo "=== Persona-spine gate ==="
        - node scripts/check-persona-spine.mjs

        - echo "Creating .env.production with required SSR env vars..."
        - rm -f .env.production

        # Use Node.js to write .env.production because Amplify env vars are accessible to Node.js but not shell
        - node scripts/create-env-production.js

        # Add backend version for debugging
        - echo "Setting BACKEND_VERSION..."
        - export BACKEND_VERSION="${AWS_BRANCH:-unknown}-${AWS_COMMIT_ID:-$(git rev-parse --short HEAD)}"
        - echo "BACKEND_VERSION=$BACKEND_VERSION" >> .env.production
        
        # Cache busting - force fresh build
        - echo "Busting caches..."
        - rm -rf .next/cache
        - rm -rf node_modules/.cache

        # SAFE DIAGNOSTIC: print only keys + whether empty, never values
        - echo "=== .env.production keys + empty-check (REDACTED) ==="
        - node scripts/check-env-production.js

        # Hard fail if PayPal creds missing
        - node -e "if(!process.env.PAYPAL_CLIENT_ID||!process.env.PAYPAL_CLIENT_SECRET){console.error('PAYPAL env vars missing in build env');process.exit(1)}"

        # CONSTITUTIONAL GATE — VL-CT-001 venture receipt vocabulary (RULING 1,
        # 2026-07-29). Runs AFTER the migrations the operator applies to
        # Supabase and BEFORE this artifact is promoted, and exits non-zero on
        # any incompatibility.
        #
        # WHAT IT PREVENTS. The nine venture action types are declared twice —
        # the TypeScript union and the activity_receipts CHECK constraint. A
        # build carrying them against a database without the migration
        # typechecks, passes every canary, and deploys green; the breakage
        # surfaces later as a check violation inside a receipt write that
        # several call sites wrap in an empty catch, so the row AND its DVN
        # anchor are lost with no log. Promoting an artifact that cannot write
        # its own receipts IS the failure.
        #
        # FAILS CLOSED, with no bypass flag: probe missing, probe revoked (it is
        # service_role-only since 20260929000200), credentials absent, network
        # unreachable, constraint absent or short — all exit 1. The runtime
        # emission guard stays in place as defence in depth, memoised per
        # process, so it is NOT a per-request or cold-start database probe.
        #
        # Placed after create-env-production.js because it needs
        # SUPABASE_SERVICE_ROLE_KEY, and ahead of the Next compile so a refusal costs
        # seconds rather than a full build. See CLAUDE.md → "DVN
        # Pipeline Protection" and
        # codexes/packs/agentiq/updates/2026-07-29_vl-ct-001-deployment-gate-and-probe-lockdown.md.
        - echo "=== VL-CT-001 venture receipt constraint gate ==="
        - npx tsx scripts/check-venture-receipt-constraint.ts

        - echo ".env.production created. Building Next.js..."
        # Next 15 build memory. Empirically on the CURRENT (small) Amplify build
        # instance no single heap value works — the instance itself is the limit:
        #   3072: compile is FLAKY — sometimes fits, sometimes OOMs mid-compile
        #         (V8 "Ineffective mark-compacts"); Next 15 compile peaks ~3.2 GB.
        #   4096/6144: compile reliable, but then `spawn ENOMEM` — the ~4 GB
        #         parent can't fork the page-data worker within the instance RAM.
        # 6144: comfortable compile headroom (~2x Next 15's ~3.2GB peak) on the
        # enlarged Amplify build instance. Parent (~6GB) + page-data worker fork
        # still sit well under a 16GB instance, so no spawn ENOMEM. Kept below
        # the instance ceiling so the fork always has room; if a future build
        # needs more, raise the instance tier rather than the heap past ~half of
        # instance RAM (that reintroduces the fork squeeze).
        - export NODE_OPTIONS="--max-old-space-size=6144"
        - export NEXT_PRIVATE_BUILD_WORKER=1
        - npm run build

        # Pack-corpus export (Phase B — FATAL): upload the pack markdown+JSON to
        # Supabase Storage (the runtime read path) + pin the canonical subset to
        # AutoDrive (provenance). As of Phase B next.config no longer traces the
        # pack .md into the bundle, so the deployed copilot + docs tabs DEPEND on
        # this blob. Making it fatal is the safety interlock: if the upload fails,
        # the build fails and the previous (corpus-bundled) revision keeps serving
        # — there is never a window where a corpus-less bundle ships. The script
        # itself exits nonzero on missing creds / failed upload in an Amplify build.
        - echo "=== Exporting pack corpus to remote store (Phase B, required) ==="
        - node scripts/export-pack-corpus.mjs

        - echo "Copying .env.production into standalone bundle..."
        - cp .env.production .next/standalone/.env.production || true

        - echo "Patching standalone server.js to load dotenv at runtime..."
        - node scripts/patch-standalone-dotenv.js

        # Amplify Hosting SSR compute has a HARD 220 MB (230686720 byte)
        # uncompressed bundle limit — not an app-configurable quota (AWS docs +
        # aws-amplify/amplify-hosting#3841/#3863/#3647/#3699/#3980 confirm the
        # same literal byte value is a platform ceiling). Next's file tracing
        # conservatively bundles native binaries for platforms other than the
        # one Amplify's Lambda actually runs (linux x64 glibc) into
        # .next/standalone/node_modules. Deleting the non-runtime platform
        # variants AFTER build, directly on the packaged filesystem, is AWS's
        # own documented remedy for this error (troubleshooting-ssr-deployment)
        # and — unlike next.config.js outputFileTracingExcludes on a per-route
        # key — is not subject to any cross-route include/dedupe semantics:
        # bytes removed here are gone from the artifact, full stop.
        - echo "=== .next/standalone size BEFORE native-binary cleanup ==="
        - du -sh .next/standalone 2>/dev/null || true
        - echo "Removing non-linux-x64-gnu native binaries (build-only; unused at Amplify SSR runtime)..."
        - find .next/standalone/node_modules/@next -maxdepth 1 -type d -name "swc-*" ! -name "swc-linux-x64-gnu" -exec rm -rf {} + 2>/dev/null || true
        - find .next/standalone/node_modules/@swc -maxdepth 1 -type d -name "core-*" ! -name "core-linux-x64-gnu" -exec rm -rf {} + 2>/dev/null || true
        - find .next/standalone/node_modules/@esbuild -maxdepth 1 -type d ! -name "linux-x64" -exec rm -rf {} + 2>/dev/null || true
        - find .next/standalone/node_modules/@img -maxdepth 1 -type d \( -name "sharp-*" -o -name "*-libvips-*" \) ! -name "sharp-linux-x64" ! -name "sharp-libvips-linux-x64" -exec rm -rf {} + 2>/dev/null || true
        - find .next/standalone/node_modules/@napi-rs -maxdepth 1 -type d -name "canvas-*" ! -name "canvas-linux-x64-gnu" -exec rm -rf {} + 2>/dev/null || true
        # Next's file tracing already yields a minimal node_modules, so the
        # native-binary sweep above reclaims little on its own. The reliable,
        # zero-runtime-risk headroom is DEBUG/DEV artifacts the SSR runtime never
        # loads: source maps (*.map) across the whole .next tree, and any type
        # declarations / package docs that slipped into the traced node_modules.
        # None are require()d at runtime — deleting them cannot change behaviour.
        - echo "Removing source maps + non-runtime dev artifacts (never loaded at SSR runtime)..."
        - find .next -type f -name "*.map" -delete 2>/dev/null || true
        # NOTE: *.ts / *.mts / *.cts source (incl. all .d.ts) — a compiled Next
        # standalone app runs on plain Node with NO TypeScript loader, so NO
        # package's runtime entry resolves to a .ts file; only the compiled .js is
        # ever require()d. Deleting TS source cannot change runtime behaviour and
        # reclaims MBs (many packages ship src/*.ts alongside dist/*.js) — the
        # reliable headroom under the 230686720-byte cap now that the app has grown
        # to the ceiling (2026-07-21: ~206 KB over even after the pack-corpus move).
        - find .next/standalone/node_modules -type f \( -name "*.ts" -o -name "*.mts" -o -name "*.cts" -o -name "*.md" -o -name "*.markdown" -o -iname "readme*" -o -iname "license*" -o -iname "licence*" -o -iname "changelog*" -o -iname "notice*" -o -iname "authors*" -o -iname "contributors*" -o -iname "history*" -o -iname "changes*" -o -name "*.map" \) -delete 2>/dev/null || true
        # @types packages are TYPE-ONLY (never require()d at runtime) and .bin holds
        # CLI shim symlinks the SSR runtime never invokes — both are pure dead weight
        # in the packaged standalone. Removing them is zero-runtime-risk headroom
        # under the 230686720-byte cap (the artifact sat ~10 KB over on 2026-07-21
        # even after the file-level sweep above; the growing browsable pack corpus
        # keeps it pinned at the ceiling).
        - find .next/standalone/node_modules/@types -maxdepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
        - rm -rf .next/standalone/node_modules/.bin 2>/dev/null || true
        # playwright-core (~6 MB) — the agentic-browser exec loads it via a guarded
        # dynamic require in try/catch (degrades to "unavailable"); browser
        # automation can't run in the SSR Lambda anyway. Biggest single traced
        # package per the compute-composition log; ~30x the size overage. This
        # filesystem delete is the reliable lever (config excludes proved unreliable
        # for the packaged artifact). If a future SSR path genuinely needs headless
        # browsing, move it to a dedicated worker rather than re-bundling this.
        - rm -rf .next/standalone/node_modules/playwright-core 2>/dev/null || true
        # Test/doc/example DIRECTORIES + build-meta files that npm installs into
        # every package but the SSR runtime never require()s. Module resolution
        # uses package.json main/exports → dist/lib, never these. This is the
        # battle-tested "modclean-safe" set; deleting it cannot change runtime
        # behaviour and reclaims several MB — the reliable headroom under the
        # 230686720-byte cap when the file-level sweep above isn't enough
        # (2026-07-21: the artifact was ~260 KB over even after that sweep).
        - echo "Removing test/doc/example dirs + build-meta from node_modules (never loaded at SSR runtime)..."
        - find .next/standalone/node_modules -type d \( -name test -o -name tests -o -name __tests__ -o -name example -o -name examples -o -name doc -o -name docs -o -name coverage -o -name .nyc_output -o -name .github -o -name .idea \) -prune -exec rm -rf {} + 2>/dev/null || true
        - find .next/standalone/node_modules -type f \( -name "*.flow" -o -name "*.coffee" -o -name "*.ts.map" -o -name ".eslintrc*" -o -name ".editorconfig" -o -name ".npmignore" -o -name ".travis.yml" -o -name "*.tsbuildinfo" -o -name ".DS_Store" \) -delete 2>/dev/null || true
        # DEPENDENCY DOCUMENTATION at package ROOT (operator direction via Al,
        # 2026-08-02). The directory sweep above catches doc/ and docs/, but
        # README.md, CHANGELOG.md and HISTORY.md sit beside package.json and
        # survive it — so this is additive, not a duplicate.
        #
        # Chosen as the response to a ~97 KB overage precisely because it is
        # reversible and non-functional: module resolution goes through
        # package.json main/exports, never a README. Nothing here touches
        # application code, package manifests, native binaries, @napi-rs/canvas,
        # @img/sharp, pdf-parse, the PDF-page routes, the pack corpus, or
        # aigency/index.json.
        #
        # LICENSE, COPYING and NOTICE are deliberately NOT matched: they cost
        # little and may carry attribution obligations. Removing them to save
        # bytes would trade a legal duty for headroom.
        - echo "=== standalone node_modules BEFORE dependency-doc prune (bytes) ==="
        - du -sb .next/standalone/node_modules 2>/dev/null || true
        - echo "Pruning non-runtime dependency documentation from standalone artifact..."
        - find .next/standalone/node_modules -type f \( -iname 'README' -o -iname 'README.md' -o -iname 'README.txt' -o -iname 'CHANGELOG' -o -iname 'CHANGELOG.md' -o -iname 'HISTORY.md' \) -delete 2>/dev/null || true
        # TYPE DECLARATIONS AND SOURCE MAPS — the same modclean-safe class, and
        # the one that is actually large (2026-08-02).
        #
        # WHY THIS ESCALATED FROM THE DOC PRUNE ALONE. The build at c2c8b3b2d
        # PASSED. The very next build, 38106e519, FAILED at 230,839,420 — and
        # the entire diff between them was `.amplify-deploy` (a timestamp) and
        # `amplify.yml` (a change that only DELETES files). No application code,
        # no dependency change, artifact ~153 KB LARGER.
        #
        # The artifact size is therefore NOT deterministic between builds. The
        # failures alone span 230,784,106 → 230,869,128 (~85 KB), with at least
        # one pass below the cap — over 180 KB of run-to-run variance at
        # identical source. Sitting 97 KB under the ceiling is not "nearly
        # fixed", it is a coin flip. Chasing the last 97 KB is chasing noise.
        #
        # `.d.ts` / `.d.mts` / `.d.cts` are TypeScript declarations: consumed by
        # the compiler at BUILD time, never resolved by Node at runtime.
        # `.map` files are debugger sidecars, loaded only when a devtools
        # session asks for them. Neither is application code, a package
        # manifest, a licence, or a native binary — and both are large across a
        # ~89 MB node_modules. This is the headroom, not another 97 KB.
        - echo "Pruning type declarations + source maps (build-time only, never require()d)..."
        - find .next/standalone/node_modules -type f \( -name "*.d.ts" -o -name "*.d.mts" -o -name "*.d.cts" -o -name "*.map" \) -delete 2>/dev/null || true
        # Remaining documentation of the same class as the six above. Kept as a
        # separate line so the doc prune Al specified stays legible as its own
        # act. LICENSE / COPYING / NOTICE remain unmatched throughout.
        - find .next/standalone/node_modules -type f \( -iname 'CHANGES.md' -o -iname 'HISTORY' -o -iname 'CHANGELOG.txt' -o -iname 'CONTRIBUTING.md' -o -iname 'SECURITY.md' -o -iname 'CODE_OF_CONDUCT.md' -o -iname 'AUTHORS' -o -iname 'AUTHORS.md' \) -delete 2>/dev/null || true
        # pdf-parse VENDORS FOUR COMPLETE pdf.js BUILDS (2026-08-02) — this is
        # the actual dead weight, and the reason the two prunes above reclaimed
        # nothing measurable (standalone moved 188,345,601 -> 188,350,253
        # across the build that added them: +4.6 KB, i.e. noise).
        #
        # WHY THOSE PRUNES WERE ~ZERO. Next's file tracer copies only the files
        # the runtime actually resolves. README/CHANGELOG/.d.ts/.map were never
        # in .next/standalone/node_modules to begin with, so deleting them
        # removed nothing. They are kept below as a cheap guard, not as a fix.
        #
        # WHAT IS ACTUALLY THERE. pdf-parse ships lib/pdf.js/{v1.9.426,
        # v1.10.88, v1.10.100, v2.0.550} — four full pdf.js distributions, 32 MB
        # on disk locally and the bulk of the 9 MB traced here. It picks one at
        # runtime with a TEMPLATE-LITERAL require:
        #
        #     require(`./pdf.js/${options.version}/build/pdf.js`)
        #
        # which the tracer cannot resolve statically, so it conservatively
        # copies ALL FOUR.
        #
        # Only v1.10.100 is ever loaded: pdf-parse's DEFAULT_OPTIONS.version is
        # 'v1.10.100' (lib/pdf-parse.js:42) and all three call sites in this
        # repo — pdfExtractionService.ts:98, uploadIndexer.ts:244, and the VSP
        # evidence upload route:74 — call pdfParse(buffer) with NO options.
        # Verified 2026-08-02: no caller anywhere passes a `version`.
        #
        # If a future caller needs a different pdf.js build, it will fail with
        # "Cannot find module ./pdf.js/<v>/build/pdf.js" — that is the signal to
        # widen this keep-list, not to silently restore all four.
        - echo "Removing unused vendored pdf.js builds from pdf-parse (keeping v1.10.100, the only one loaded)..."
        - find .next/standalone/node_modules/pdf-parse/lib/pdf.js -mindepth 1 -maxdepth 1 -type d ! -name 'v1.10.100' -exec rm -rf {} + 2>/dev/null || true
        - echo "=== standalone node_modules AFTER dependency-doc prune (bytes) ==="
        - du -sb .next/standalone/node_modules 2>/dev/null || true
        - echo "=== pdf-parse AFTER vendored-build prune (bytes) ==="
        - du -sb .next/standalone/node_modules/pdf-parse 2>/dev/null || true
        # Prove exactly which pdf.js distribution survived — a size alone cannot
        # show that the RETAINED one is the retained one.
        - echo "=== surviving pdf.js distributions ==="
        - find .next/standalone/node_modules/pdf-parse/lib/pdf.js -maxdepth 2 -type d 2>/dev/null | sort || true
        - echo "=== final artifact composition (bytes) ==="
        - du -sb .next/standalone .next/static .next/standalone/node_modules .next/standalone/node_modules/pdf-parse 2>/dev/null || true
        # WHAT IS ACTUALLY BEING MEASURED (2026-08-02).
        #
        # The pdf-parse specialization removed 6,249,974 bytes from
        # .next/standalone (188,345,601 -> 182,095,627). Amplify's reported
        # build output moved 1,954 bytes (230,842,832 -> 230,840,878). Static
        # was unchanged. So the measured artifact is INSENSITIVE to
        # .next/standalone's size, and every prune aimed there — docs, .d.ts,
        # .map, the three pdf.js builds — has been reclaiming bytes that the
        # cap does not count.
        #
        # `artifacts.baseDirectory` is `.next` with `**/*`, so the cap covers
        # the WHOLE .next tree, not the standalone subtree we have been
        # trimming. The obvious untrimmed resident is `.next/cache`: it is
        # deleted BEFORE `next build` (cache-busting, above) and therefore
        # regenerated DURING the build, landing inside the artifact. It is
        # build cache — Next regenerates it and Amplify caches it separately;
        # nothing at runtime reads it.
        #
        # Measured first, then removed, so the log proves the size rather than
        # this comment asserting it.
        - echo "=== WHOLE .next tree, by component (bytes) ==="
        - du -sb .next .next/cache .next/server .next/standalone .next/static 2>/dev/null || true
        - echo "Removing .next/cache — build cache, regenerated next build, never read at runtime..."
        - rm -rf .next/cache 2>/dev/null || true
        - echo "=== .next AFTER cache removal (bytes) ==="
        - du -sb .next 2>/dev/null || true
        # Pack MARKDOWN bodies: the reliable removal. Dropping the next.config
        # include stops NEW tracing, but Next still copies the pack .md that land
        # in .next/standalone/codexes/packs (include/exclude carry cross-route
        # dedupe semantics; a postBuild delete does not — bytes removed here are
        # gone from the artifact, full stop). We serve these .md from the remote
        # corpus store at runtime (services/knowledge/packCorpusStore.ts), so
        # deleting the ~5 MB of bundled bodies is what actually drops the artifact
        # under the 230686720-byte cap. GATED on PACK_CORPUS_URL being pinned in
        # .env.production — the exporter writes it ONLY after a successful,
        # verified public upload — so we never strip the bundle unless the blob
        # is confirmed live. The pack .json (registry metadata) is preserved.
        # EXCLUDES: the two sync-context .md readers kept bundled on purpose
        # (services/experiments/exp001.ts artifacts + the constitutional glossary
        # read by ontologyResolver) have NO remote fallback, so preserve them.
        # Also strips NON-MANIFEST pack .json (index.json, data blobs) — those are
        # served from the corpus blob too; only collections.json + meta.json stay
        # (packRegistry reads them via fs to build the picker + lists pack dirs).
        - >
          if grep -q "^PACK_CORPUS_URL=" .env.production 2>/dev/null; then
            echo "Corpus blob live — removing bundled pack .md + non-manifest .json from standalone (served remotely)...";
            find .next/standalone/codexes/packs -type f -name "*.md" \
              ! -path "*/exp-001-living-knowledgeqube/*" \
              ! -name "constitutional-glossary.md" \
              -delete 2>/dev/null || true;
            find .next/standalone/codexes/packs -type f -name "*.json" \
              ! -name "collections.json" \
              ! -name "meta.json" \
              -delete 2>/dev/null || true;
          else
            echo "PACK_CORPUS_URL not pinned — keeping bundled pack corpus (corpus store falls back to FS)";
          fi
        - echo "=== .next/standalone size AFTER native-binary + dev-artifact cleanup ==="
        - du -sh .next/standalone 2>/dev/null || true
        - echo "=== .next total size AFTER cleanup ==="
        - du -sh .next 2>/dev/null || true
        # COMPUTE COMPOSITION (bytes) — the Amplify SSR 'build output' cap measures
        # .next/standalone + .next/static. Log each component + the biggest traced
        # node_modules packages so we trim the ACTUAL weight, not the wrong tree.
        - echo "=== COMPUTE COMPOSITION (bytes) ==="
        - du -sb .next/standalone .next/static .next/standalone/node_modules .next/standalone/.next .next/standalone/codexes 2>/dev/null || true
        - echo "=== biggest .next/standalone/node_modules packages (MB) ==="
        - du -sm .next/standalone/node_modules/* .next/standalone/node_modules/@*/* 2>/dev/null | sort -rn | head -30 || true
        - echo "=== biggest .next/static subtrees (MB) ==="
        - du -sm .next/static/* 2>/dev/null | sort -rn | head -15 || true

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      # Temporarily disable caching to force fresh build
      # - node_modules/**/*
      # - .next/cache/**/*
